apiVersion: vorton.dev/v1alpha1
kind: Installation
metadata:
  name: moonbase-lab
spec:
  realm: organizational
  release:
    channel: pinned
    version: 0.1.0
  modules:
    - admin
    - tasks
    - tools
    - factory
  deployment:
    provider: fly
    region: sea
  authority:
    canonicalRecords: supabase-postgres
    derivedMemory: hindsight
  factory:
    mode: read-only
  tools:
    installed: []
    examples:
      - name: Moonbase Triage
        installed: false
  secrets:
    supabase-url: VORTON_SUPABASE_URL
    supabase-anon-key: VORTON_SUPABASE_ANON_KEY
    database-url: VORTON_DATABASE_URL
    hindsight-url: VORTON_HINDSIGHT_URL
    hindsight-api-key: VORTON_HINDSIGHT_API_KEY
