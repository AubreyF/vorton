name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  secret-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install pinned Gitleaks
        env:
          GITLEAKS_ARCHIVE_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GITLEAKS_VERSION: 8.30.1
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          install_directory="$RUNNER_TEMP/gitleaks-bin"
          mkdir -p "$install_directory"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "$GITLEAKS_ARCHIVE_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$install_directory" gitleaks
          echo "$install_directory" >> "$GITHUB_PATH"
      - name: Scan complete Git history
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          test "$(gitleaks version)" = "$GITLEAKS_VERSION"
          gitleaks git --redact=100 --no-banner .

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run release:validate
      - run: npm run format:check

  release-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - name: Detect a release manifest child
        id: release
        run: |
          if git diff-tree -m --no-commit-id --name-only -r HEAD \
            | grep -Eq '^release/manifests/[^/]+\.json$'; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.release.outputs.present == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.release.outputs.present == 'true'
        run: npm ci
      - if: steps.release.outputs.present == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - if: steps.release.outputs.present == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the exact release child and runtime evidence
        if: steps.release.outputs.present == 'true'
        run: >-
          npm run release:preflight --
          --if-present
          --repository-owner "${{ github.repository_owner }}"
          --release-commit "$(git rev-parse HEAD)"

  postgres-authority:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vorton_authority
          POSTGRES_PASSWORD: synthetic-admin-password-000000000001
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vorton_authority"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:postgres-authority
        env:
          VORTON_AUTHORITY_TEST_DATABASE_URL: postgresql://postgres:synthetic-admin-password-000000000001@127.0.0.1:5432/vorton_authority
