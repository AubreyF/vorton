name: Publish immutable release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag to publish
        required: true
        type: string

permissions:
  contents: write
  packages: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aubos_authority
          POSTGRES_PASSWORD: synthetic-admin-password-000000000001
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aubos_authority"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Resolve release version
        id: version
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          git show-ref --verify "refs/tags/$TAG_NAME"
          test "$(git rev-list -n 1 "$TAG_NAME")" = "$(git rev-parse HEAD)"
          version=${TAG_NAME#v}
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - name: Verify PostgreSQL authority boundary
        run: npm run test:postgres-authority
        env:
          AUBOS_AUTHORITY_TEST_DATABASE_URL: postgresql://postgres:synthetic-admin-password-000000000001@127.0.0.1:5432/aubos_authority
      - run: npm run check
      - run: npm run format:check
      - name: Verify tagged release manifest and source parent
        run: >-
          npm run release:validate --
          --version "${{ steps.version.outputs.value }}"
          --released
          --repository-owner "${{ github.repository_owner }}"
          --release-commit "$(git rev-parse HEAD)"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify published image references
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST: release/manifests/${{ steps.version.outputs.value }}.json
        run: |
          schema_version=$(jq -r '.schemaVersion' "$MANIFEST")
          expected_images="control-plane,worker"
          if [ "$schema_version" = "2" ]; then
            expected_images="control-plane,web,worker"
          fi
          test "$(jq -r '.images | keys | join(",")' "$MANIFEST")" = "$expected_images"
          source_commit=$(jq -r '.sourceCommit' "$MANIFEST")
          while IFS= read -r reference; do
            docker buildx imagetools inspect "$reference" >/dev/null
            labels=$(docker buildx imagetools inspect "$reference" --format '{{json .Image.Config.Labels}}')
            test "$(jq -r '."org.opencontainers.image.revision"' <<<"$labels")" = "$source_commit"
            docker buildx imagetools inspect "$reference" --format '{{json .Provenance}}' \
              | jq -e 'type == "object" and length > 0' >/dev/null
            docker buildx imagetools inspect "$reference" --format '{{json .SBOM}}' \
              | jq -e 'type == "object" and length > 0' >/dev/null
          done < <(jq -r '.images[].reference' "$MANIFEST")
      - name: Assemble deterministic release contract artifact
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          artifact="aubos-$VERSION-contracts.tgz"
          staging_directory=$(mktemp -d)
          npx tsx release/stage-contract-archive.ts "$staging_directory"
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -C "$staging_directory" -cf - . \
            | gzip -n > "$artifact"
          sha256sum "$artifact" > "$artifact.sha256"
      - name: Generate release SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          file: aubos-${{ steps.version.outputs.value }}-contracts.tgz
          output-file: aubos-${{ steps.version.outputs.value }}.spdx.json
          artifact-name: aubos-${{ steps.version.outputs.value }}-sbom
          upload-release-assets: false
      - name: Create GitHub Release from tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          {
            echo '(AI Generated).'
            echo
            echo "Immutable AubOS $VERSION release contracts and software bill of materials."
            echo
            echo 'Runtime images are identified only by the digest-pinned GHCR references in the release manifest.'
          } > release-notes.md
          gh release create "$TAG_NAME" \
            "aubos-$VERSION-contracts.tgz" \
            "aubos-$VERSION-contracts.tgz.sha256" \
            "aubos-$VERSION.spdx.json" \
            --verify-tag \
            --title "AubOS $TAG_NAME" \
            --notes-file release-notes.md
