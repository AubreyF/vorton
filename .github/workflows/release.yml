name: Publish immutable release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Resolve release version
        id: version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version=${TAG_NAME#v}
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - name: Verify tagged release manifest and source parent
        run: >-
          npm run release:validate --
          --version "${{ steps.version.outputs.value }}"
          --released
          --release-commit "$GITHUB_SHA"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify published image references
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST: release/manifests/${{ steps.version.outputs.value }}.json
        run: |
          test "$(jq -r '.images | keys | join(",")' "$MANIFEST")" = "control-plane,worker"
          while IFS= read -r reference; do
            docker buildx imagetools inspect "$reference" >/dev/null
            gh attestation verify "oci://$reference" -R "$GITHUB_REPOSITORY" >/dev/null
          done < <(jq -r '.images[].reference' "$MANIFEST")
      - name: Assemble deterministic release contract artifact
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          artifact="aubos-$VERSION-contracts.tgz"
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -cf - release schemas deploy templates | gzip -n > "$artifact"
          sha256sum "$artifact" > "$artifact.sha256"
      - name: Generate release SBOM
        uses: anchore/sbom-action@v0
        with:
          file: aubos-${{ steps.version.outputs.value }}-contracts.tgz
          output-file: aubos-${{ steps.version.outputs.value }}.spdx.json
          artifact-name: aubos-${{ steps.version.outputs.value }}-sbom
          upload-release-assets: false
      - name: Attest release provenance
        uses: actions/attest@v4
        with:
          subject-path: aubos-${{ steps.version.outputs.value }}-contracts.tgz
      - name: Attest release SBOM
        uses: actions/attest@v4
        with:
          subject-path: aubos-${{ steps.version.outputs.value }}-contracts.tgz
          sbom-path: aubos-${{ steps.version.outputs.value }}.spdx.json
      - name: Create GitHub Release from tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          {
            echo '(AI Generated).'
            echo
            echo "Immutable AubOS $VERSION release contracts and software bill of materials."
            echo
            echo 'Runtime images are identified only by the digest-pinned GHCR references in the release manifest.'
          } > release-notes.md
          gh release create "$TAG_NAME" \
            "aubos-$VERSION-contracts.tgz" \
            "aubos-$VERSION-contracts.tgz.sha256" \
            "aubos-$VERSION.spdx.json" \
            --verify-tag \
            --title "AubOS $TAG_NAME" \
            --notes-file release-notes.md
