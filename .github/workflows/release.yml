name: Publish immutable release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag to publish
        required: true
        type: string

permissions:
  contents: write
  packages: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vorton_authority
          POSTGRES_PASSWORD: synthetic-admin-password-000000000001
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vorton_authority"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks
        env:
          GITLEAKS_ARCHIVE_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GITLEAKS_VERSION: 8.30.1
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          install_directory="$RUNNER_TEMP/gitleaks-bin"
          mkdir -p "$install_directory"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "$GITLEAKS_ARCHIVE_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$install_directory" gitleaks
          echo "$install_directory" >> "$GITHUB_PATH"
      - name: Scan complete Git history
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          test "$(gitleaks version)" = "$GITLEAKS_VERSION"
          gitleaks git --redact=100 --no-banner .
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Resolve release version
        id: version
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          git show-ref --verify "refs/tags/$TAG_NAME"
          test "$(git rev-list -n 1 "$TAG_NAME")" = "$(git rev-parse HEAD)"
          version=${TAG_NAME#v}
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - name: Verify PostgreSQL authority boundary
        run: npm run test:postgres-authority
        env:
          VORTON_AUTHORITY_TEST_DATABASE_URL: postgresql://postgres:synthetic-admin-password-000000000001@127.0.0.1:5432/vorton_authority
      - run: npm run check
      - run: npm run format:check
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify exact release child and runtime evidence
        run: >-
          npm run release:preflight --
          --version "${{ steps.version.outputs.value }}"
          --repository-owner "${{ github.repository_owner }}"
          --release-commit "$(git rev-parse HEAD)"
      - name: Assemble deterministic release contract artifact
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          artifact="vorton-$VERSION-contracts.tgz"
          staging_directory=$(mktemp -d)
          npx tsx release/stage-contract-archive.ts "$staging_directory"
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -C "$staging_directory" -cf - . \
            | gzip -n > "$artifact"
          sha256sum "$artifact" > "$artifact.sha256"
      - name: Generate release SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          file: vorton-${{ steps.version.outputs.value }}-contracts.tgz
          output-file: vorton-${{ steps.version.outputs.value }}.spdx.json
          artifact-name: vorton-${{ steps.version.outputs.value }}-sbom
          syft-version: v1.42.3
          upload-artifact: false
          upload-release-assets: false
      - name: Normalize deterministic SBOM identity
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          sbom="vorton-$VERSION.spdx.json"
          npm run release:normalize-sbom -- \
            --artifact "vorton-$VERSION-contracts.tgz" \
            --manifest "release/manifests/$VERSION.json" \
            --sbom "$sbom"
      - name: Publish or recover the exact GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          artifact="vorton-$VERSION-contracts.tgz"
          checksum="$artifact.sha256"
          sbom="vorton-$VERSION.spdx.json"
          printf '%s\n\n%s\n\n%s' \
            '(AI Generated).' \
            "Immutable Vorton $VERSION release contracts and software bill of materials." \
            'Runtime images are identified only by the digest-pinned GHCR references in the release manifest.' \
            > release-notes.md

          # BEGIN bounded release discovery
          find_release() {
            gh api --paginate --slurp \
              "/repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              > release-pages.json
            jq --arg tag "$TAG_NAME" \
              '[.[][] | select(.tag_name == $tag)]' \
              release-pages.json > matching-releases.json
            release_count=$(jq 'length' matching-releases.json)
            if [ "$release_count" -gt 1 ]; then
              echo "found $release_count GitHub Releases for $TAG_NAME" >&2
              return 1
            fi
          }

          find_release
          release_count=$(jq 'length' matching-releases.json)
          if [ "$release_count" -eq 0 ]; then
            gh release create "$TAG_NAME" \
              --draft \
              --verify-tag \
              --title "Vorton $TAG_NAME" \
              --notes-file release-notes.md
            for visibility_check in 1 2 3 4 5 6; do
              find_release
              release_count=$(jq 'length' matching-releases.json)
              if [ "$release_count" -eq 1 ]; then
                break
              fi
              if [ "$visibility_check" -lt 6 ]; then
                sleep 2
              fi
            done
          fi
          test "$release_count" -eq 1
          # END bounded release discovery
          test "$(jq -r '.[0].tag_name' matching-releases.json)" = "$TAG_NAME"
          test "$(jq -r '.[0].prerelease' matching-releases.json)" = "false"
          test "$(jq -r '.[0].name' matching-releases.json)" = "Vorton $TAG_NAME"
          jq -j '.[0].body' matching-releases.json > existing-release-notes.md
          cmp --silent release-notes.md existing-release-notes.md
          release_id=$(jq -r '.[0].id' matching-releases.json)
          release_is_draft=$(jq -r '.[0].draft' matching-releases.json)

          printf '%s\n' "$artifact" "$checksum" "$sbom" \
            | sort > expected-assets.txt
          jq -r '.[0].assets[].name' matching-releases.json \
            | sort > existing-assets.txt
          unexpected=$(comm -13 expected-assets.txt existing-assets.txt)
          if [ -n "$unexpected" ]; then
            while IFS= read -r asset; do
              echo "unexpected release asset: $asset" >&2
            done <<< "$unexpected"
            exit 1
          fi

          verify_release_assets() {
            gh api "/repos/$GITHUB_REPOSITORY/releases/$release_id" \
              > exact-release.json
            jq -r '.assets[].name' exact-release.json \
              | sort > actual-assets.txt
            cmp --silent expected-assets.txt actual-assets.txt

            download_directory=$(mktemp -d)
            while IFS= read -r asset; do
              asset_id=$(jq --arg name "$asset" -r \
                '.assets[] | select(.name == $name) | .id' exact-release.json)
              test -n "$asset_id"
              gh api \
                -H 'Accept: application/octet-stream' \
                "/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
                > "$download_directory/$asset"
              cmp --silent "$asset" "$download_directory/$asset"
            done < expected-assets.txt
            (
              cd "$download_directory"
              sha256sum -c "$checksum"
            )
          }

          if [ "$release_is_draft" = "false" ]; then
            verify_release_assets
            cp exact-release.json published-release.json
          else
            test "$release_is_draft" = "true"
            gh release upload "$TAG_NAME" \
              "$artifact" \
              "$checksum" \
              "$sbom" \
              --clobber
            verify_release_assets
            gh api --method PATCH \
              "/repos/$GITHUB_REPOSITORY/releases/$release_id" \
              -F draft=false > published-release.json
          fi
          test "$(jq -r '.tag_name' published-release.json)" = "$TAG_NAME"
          test "$(jq -r '.draft' published-release.json)" = "false"
          test "$(gh release view "$TAG_NAME" --json tagName --jq .tagName)" = "$TAG_NAME"
