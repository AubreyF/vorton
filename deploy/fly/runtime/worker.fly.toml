app = "replace-with-aubos-worker-app"
primary_region = "sjc"

[build]
  dockerfile = "deploy/docker/worker.Dockerfile"

[env]
  PORT = "8080"
  AUBOS_WORKER_PROVIDER = "openai-responses"
  AUBOS_OPENAI_MODEL = "replace-with-explicit-model"
  AUBOS_OPENAI_STORE_RESPONSES = "false"
  AUBOS_OPENAI_CLASSIFICATION_CEILING = "internal"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_start_machines = true
  auto_stop_machines = "stop"
  min_machines_running = 1

  [[services.http_checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"
