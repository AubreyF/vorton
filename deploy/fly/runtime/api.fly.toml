app = "replace-with-aubos-api-app"
primary_region = "sjc"

[build]
  dockerfile = "deploy/docker/control-plane.Dockerfile"

[env]
  PORT = "8080"
  AUBOS_DATABASE_SSL = "true"
  AUBOS_SUPABASE_PROJECT_REF = "replace-with-project-ref"
  AUBOS_SUPABASE_URL = "https://replace-with-project-ref.supabase.co"
  AUBOS_SUPABASE_JWT_ISSUER = "https://replace-with-project-ref.supabase.co/auth/v1"
  AUBOS_SUPABASE_JWT_AUDIENCE = "authenticated"
  AUBOS_SUPABASE_JWKS_URL = "https://replace-with-project-ref.supabase.co/auth/v1/.well-known/jwks.json"
  AUBOS_WORKER_URL = "http://replace-with-aubos-worker-app.internal:8080"
  AUBOS_WORKER_PROVIDER = "openai-responses"
  AUBOS_WORKER_MODEL = "replace-with-explicit-model"
  AUBOS_WORKER_CLASSIFICATION_CEILING = "internal"
  AUBOS_ALLOWED_ORIGIN = "https://replace-with-aubos-web-app.fly.dev"
  AUBOS_HINDSIGHT_URL = "http://replace-with-aubos-hindsight-app.internal:8888"

# Required secrets: AUBOS_DATABASE_URL, AUBOS_WORKER_SHARED_SECRET,
# AUBOS_HINDSIGHT_API_KEY

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "stop"
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"
