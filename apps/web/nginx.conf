server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://*.supabase.co https://*.fly.dev; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'" always;

  location = /healthz {
    access_log off;
    add_header Content-Type application/json;
    return 200 '{"status":"ok","service":"aubos-web"}';
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
